
name: Build KasKu Majelis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q KasKuMajelis_Android_Project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin compatibility
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
        working-directory: KasKuMajelis_Android

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: KasKuMajelis_Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasKuMajelis-APK
          path: KasKuMajelis_Android/app/build/outputs/apk/debug/*.apk
